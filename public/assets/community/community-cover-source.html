<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fathers Front Community Covers</title>
  <style>
    @font-face {
      font-family: "Tungsten Condensed";
      src: url("/fonts/tungsten/tungsten-condensed-bold/tungsten-condensed-bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Barlow Condensed";
      src: url("/fonts/site/barlow-condensed-700.woff2") format("woff2");
      font-weight: 700;
    }
    @font-face {
      font-family: "Source Serif 4";
      src: url("/fonts/site/source-serif-4-600-italic.woff2") format("woff2");
      font-style: italic;
      font-weight: 600;
    }
    :root {
      --ink: #171412;
      --cream: #f4ecdc;
      --oxblood: #912d2f;
      --ember: #e84509;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #555; }
    .cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate;
      color: var(--cream);
    }
    .cover[hidden] { display: none !important; }
    .wordmark {
      display: flex;
      gap: .12em;
      font: 700 220px/.78 "Tungsten Condensed", "Barlow Condensed", Impact, sans-serif;
      letter-spacing: .025em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .wordmark .front { color: var(--oxblood); }
    .rule {
      width: 100%;
      height: 3px;
      background: var(--oxblood);
    }
    .cover-one {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 46%, rgba(244,236,220,.035), transparent 40%),
        var(--ink);
    }
    .cover-one::after,
    .cover-three::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .14;
      background: url("/assets/headline-newsprint-texture.png") center/720px repeat;
      mix-blend-mode: screen;
    }
    .cover-one .content { width: 1250px; }
    .cover-one .rule { margin-top: 70px; }
    .cover-five {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(244,236,220,.035), transparent 40%),
        var(--ink);
    }
    .cover-five::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .14;
      background: url("/assets/headline-newsprint-texture.png") center/720px repeat;
      mix-blend-mode: screen;
    }
    .cover-five .content { width: 1250px; }
    .cover-five .rule { margin-top: 58px; }
    .cover-five .fronts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 30px;
      color: var(--cream);
      font: 700 48px/1 "Barlow Condensed", Impact, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .cover-five .fronts i {
      width: 8px;
      height: 8px;
      background: var(--oxblood);
      border-radius: 50%;
    }
    .cover-two {
      background: var(--ink) url("/assets/community/community-abstract-background.png") center/cover no-repeat;
    }
    .cover-two::after,
    .cover-four::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(23,20,18,.08), transparent 62%);
    }
    .cover-two .content {
      position: absolute;
      left: 105px;
      top: 120px;
      width: 850px;
    }
    .cover-two .wordmark { font-size: 150px; }
    .cover-two .eyebrow,
    .cover-four .eyebrow {
      margin: 70px 0 20px;
      color: var(--cream);
      font: 700 28px/1 "Barlow Condensed", sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .cover-two h2,
    .cover-four h2 {
      max-width: 750px;
      margin: 0;
      color: var(--cream);
      font: 700 82px/.92 "Barlow Condensed", sans-serif;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }
    .cover-two h2 em { color: var(--ember); font-family: "Source Serif 4", Georgia, serif; text-transform: none; }
    .cover-three {
      display: grid;
      align-content: center;
      padding: 0 220px;
      background:
        linear-gradient(90deg, var(--cream) 0 12%, var(--ink) 12% 100%);
    }
    .cover-three .content { margin-left: 0; }
    .cover-three .wordmark { font-size: 190px; }
    .cover-three .brotherhood {
      margin: 18px 0 0 360px;
      color: var(--ember);
      font: 600 italic 116px/.9 "Source Serif 4", Georgia, serif;
    }
    .cover-three .rule { width: 850px; margin: 64px 0 0 360px; }
    .cover-four {
      background: var(--cream) url("/assets/community/community-four-fronts-background.png") center/cover no-repeat;
      color: var(--ink);
    }
    .cover-four .content {
      position: absolute;
      left: 95px;
      top: 105px;
      width: 760px;
    }
    .cover-four .wordmark {
      color: var(--ink);
      font-size: 116px;
    }
    .cover-four .wordmark .front { color: var(--oxblood); }
    .cover-four .eyebrow {
      margin-top: 135px;
      color: var(--oxblood);
    }
    .cover-four h2 { color: var(--ink); font-size: 96px; }
    .cover-four h2 span {
      display: block;
      color: var(--ember);
      font: 600 italic 86px/.9 "Source Serif 4", Georgia, serif;
      text-transform: none;
    }
  </style>
</head>
<body>
  <section class="cover cover-one" id="cover-one" aria-label="Simple Fathers Front wordmark">
    <div class="content">
      <div class="wordmark"><span>Fathers</span><span class="front">Front</span></div>
      <div class="rule"></div>
    </div>
  </section>

  <section class="cover cover-two" id="cover-two" aria-label="Fathers Front website-inspired community cover">
    <div class="content">
      <div class="wordmark"><span>Fathers</span><span class="front">Front</span></div>
      <div class="eyebrow">The Fathers Front Community</div>
      <h2>Four Fronts.<br><em>One Father.</em></h2>
    </div>
  </section>

  <section class="cover cover-three" id="cover-three" aria-label="Fathers Front Brotherhood cover">
    <div class="content">
      <div class="wordmark"><span>Fathers</span><span class="front">Front</span></div>
      <div class="brotherhood">Brotherhood</div>
      <div class="rule"></div>
    </div>
  </section>

  <section class="cover cover-four" id="cover-four" aria-label="Four Fronts one brotherhood cover">
    <div class="content">
      <div class="wordmark"><span>Fathers</span><span class="front">Front</span></div>
      <div class="eyebrow">Leadership · Lifestyle · Law · Love</div>
      <h2>Four Fronts.<span>One Brotherhood.</span></h2>
    </div>
  </section>

  <section class="cover cover-five" id="cover-five" aria-label="Fathers Front wordmark with the Four Fronts">
    <div class="content">
      <div class="wordmark"><span>Fathers</span><span class="front">Front</span></div>
      <div class="rule"></div>
      <div class="fronts">
        <span>Leadership</span><i aria-hidden="true"></i>
        <span>Lifestyle</span><i aria-hidden="true"></i>
        <span>Law</span><i aria-hidden="true"></i>
        <span>Love</span>
      </div>
    </div>
  </section>
  <script>
    const requestedCover = new URLSearchParams(location.search).get("cover");
    if (requestedCover) {
      document.querySelectorAll(".cover").forEach((cover, index) => {
        cover.hidden = String(index + 1) !== requestedCover;
      });
    }
  </script>
</body>
</html>
